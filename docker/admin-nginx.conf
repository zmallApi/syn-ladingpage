server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
