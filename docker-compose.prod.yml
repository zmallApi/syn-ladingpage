# Synapsee produção — API + Admin
# Uso:
#   cp .env.prod.example .env.prod
#   # edite secrets + PUBLIC_API_URL
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Portas padrão no host (evitam pfit): API :3100 · Admin :8180
# Dentro do container a API continua em 3000.
# Landing fica no Netlify (não entra neste compose).

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: synapsee-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - synapsee_data:/data
    ports:
      - "${API_HOST_PORT:-3100}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        VITE_USE_MOCK: "false"
    container_name: synapsee-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_HOST_PORT:-8180}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  synapsee_data:
